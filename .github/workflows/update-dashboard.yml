name: Update profile dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 0"
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-dashboard.yml
      - scripts/update_dashboard.py

permissions:
  contents: write

concurrency:
  group: profile-dashboard
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: IvesLiu1026
        run: python scripts/update_dashboard.py

      - name: Publish dashboard when data changes
        run: |
          if git diff --quiet -- assets/profile-dashboard.svg; then
            echo "Dashboard is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/profile-dashboard.svg
          git commit -m "chore: refresh profile dashboard"
          git push
